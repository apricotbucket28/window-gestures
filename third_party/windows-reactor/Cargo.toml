[package]
name = "windows-reactor"
version = "0.101.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Declarative Windows UI library for Rust"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[dependencies]
windows-collections = { git = "https://github.com/microsoft/windows-rs", rev = "c9e1b3b4ecf5479b2facd8c72cdb43aac8771f1e", default-features = false, features = ["std"] }
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "c9e1b3b4ecf5479b2facd8c72cdb43aac8771f1e", default-features = false }
windows-future = { git = "https://github.com/microsoft/windows-rs", rev = "c9e1b3b4ecf5479b2facd8c72cdb43aac8771f1e", default-features = false }
windows-reference = { git = "https://github.com/microsoft/windows-rs", rev = "c9e1b3b4ecf5479b2facd8c72cdb43aac8771f1e", default-features = false, features = ["std"] }
windows-threading = { git = "https://github.com/microsoft/windows-rs", rev = "c9e1b3b4ecf5479b2facd8c72cdb43aac8771f1e", default-features = false }
windows-time = { git = "https://github.com/microsoft/windows-rs", rev = "c9e1b3b4ecf5479b2facd8c72cdb43aac8771f1e", default-features = false }
windows-window = { git = "https://github.com/microsoft/windows-rs", rev = "c9e1b3b4ecf5479b2facd8c72cdb43aac8771f1e", default-features = false }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(windows_slim_errors, windows_cast_diagnostics)"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []
